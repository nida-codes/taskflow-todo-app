name: TaskFlow CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Check HTML file
        run: |
          grep -q "<html" index.html

      - name: Check CSS file
        run: |
          test -s style.css

      - name: Check JavaScript file
        run: |
          test -s script.js

      - name: Build/Test successful
        run: echo "TaskFlow CI checks passed successfully!"